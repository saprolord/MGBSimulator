<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miner Gun Builder - Simulator</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>MGB Damage Simulator v0.5</h1>
  </header>

  <main class="app-container">
    <!-- LEFT: ITEM PALETTE -->
    <aside class="palette">
      <h3>Items</h3>
      <div id="palette-items"></div>
    </aside>

    <!-- CENTER: CANVAS & ACTION BAR -->
    <section class="canvas-area">
      <div class="canvas-wrapper">
        <canvas id="ship-canvas" width="600" height="600"></canvas>
      </div>
      <div class="action-bar">
        <span id="selected-info">Tile: Empty</span>
        <button id="btn-rotate-ccw" class="action-btn" title="Rotate CCW (↺)">
          <img src="Images/Rotate_ccw.jpg" alt="Rotate CCW">
        </button>

        <button id="btn-rotate-cw" class="action-btn" title="Rotate CW (↻)">
          <img src="Images/Rotate_cw.jpg" alt="Rotate CW">
        </button>
        
        <button id="btn-delete" class="action-btn" title="Delete Block [Del]">
          <img src="Images/Delete.jpg" alt="Delete">
        </button>
        
        <button id="btn-clear-path" class="action-btn" title="Clear Non-Directional Blocks">
          <img src="Images/Clear.jpg" alt="Clear Path Blocks">
        </button>

        <button id="btn-clear" class="action-btn" title="Clear Entire Grid">
          <img src="Images/Clear.jpg" alt="Clear All" style="filter: hue-rotate(140deg);">
        </button>
        
      </div>
    </section>

    <!-- RIGHT: STATS & CALCULATION -->
    <section class="results-panel">
      <div class="calc-header">
        <h3>Damage Analysis</h3>
        <div class="calc-actions">
          <button id="btn-share" class="secondary" title="Copy shareable build link to clipboard">Share</button>
          <button id="btn-calc" class="primary">Calculate Damage</button>
        </div>
      </div>

      <!-- TRIALS CONFIGURATION -->
      <div class="trials-config">
        <div class="trials-label-row">
          <label for="trials-input">Simulations:</label>
          <input type="number" id="trials-input" min="1" max="5000000" step="1" value="1000000">
        </div>
        <input type="range" id="trials-slider" min="1" max="5000000" step="1" value="1000000">
      </div>

      <!-- PROGRESS BAR -->
      <div class="progress-wrapper" id="progress-wrapper">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="progress-text" id="progress-text"></div>

      <div class="kpi-cards">
        <div class="card"><span>Average DPS: </span><strong id="kpi-ev">0 </strong></div>
        <div class="card"><span>Min/Max: </span><strong id="kpi-range">0 / 0 </strong></div>
      </div>
      <div class="chart-container">
        <canvas id="chart-canvas"></canvas>
      </div>
    </section>
  </main>

  <div id="toast" class="toast">Link copied to clipboard!</div>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
