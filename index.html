<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miner Gun Builder - Simulator</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Pinned on purpose: an unpinned "latest" can break the chart code the day a new major version ships. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header>
    <h1>MGB Damage Simulator v0.8</h1>
  </header>

  <main class="app-container">
    <!-- LEFT: ITEM PALETTE (buttons are generated from js/blocks.js) -->
    <aside class="palette">
      <h3>Items</h3>
      <div id="palette-items"></div>
    </aside>

    <!-- CENTER: CANVAS & ACTION BAR -->
    <section class="canvas-area">
      <div class="ship-row">
        <label for="ship-select">Ship:</label>
        <select id="ship-select"></select>
      </div>
      <div class="canvas-wrapper">
        <canvas id="ship-canvas" width="600" height="600"></canvas>
      </div>
      <div class="action-bar">
        <div class="action-row">
          <span id="selected-info">Tile: None selected</span>
        </div>
        <div class="action-row">
          <button id="btn-delete" class="action-btn" title="Delete Block [Del]" aria-label="Delete block">
            <img src="Images/Delete.jpg" alt="">
          </button>
          <button id="btn-rotate-ccw" class="action-btn" title="Rotate CCW (↺)" aria-label="Rotate counter-clockwise">
            <img src="Images/Rotate_ccw.jpg" alt="">
          </button>
          <button id="btn-rotate-cw" class="action-btn" title="Rotate CW (↻)" aria-label="Rotate clockwise">
            <img src="Images/Rotate_cw.jpg" alt="">
          </button>
          <button id="btn-clear-path" class="action-btn" title="Clear Non-Directional Blocks" aria-label="Clear non-directional blocks">
            <img src="Images/ClearPath.webp" alt="">
          </button>
          <button id="btn-clear" class="action-btn" title="Clear Entire Grid" aria-label="Clear entire grid">
            <img src="Images/Clear.jpg" alt="">
          </button>
        </div>
        <div class="action-row">
          <button id="btn-share" class="secondary share-btn" title="Copy shareable build link to clipboard">Share Build Link</button>
        </div>
      </div>
    </section>

    <!-- RIGHT: STATS & CALCULATION -->
    <section class="results-panel">
      <div class="calc-header">
        <h3>Damage Analysis</h3>
      </div>

      <div class="config-grid-row">
        <div class="input-field-group">
          <label for="maxTierInput">Max Tier Reached:</label>
          <input type="number" id="maxTierInput" min="0" step="1" value="0" placeholder="e.g. 700">
        </div>
        <div class="input-field-group">
          <label for="fireRateInput">Fire Rate:</label>
          <input type="number" id="fireRateInput" min="0.1" step="0.1" value="1.0" placeholder="e.g. 1.0">
        </div>
      </div>

      <!-- Grey card holding the simulation controls and, below them, the results.
           (In v0.8 this <div> was never closed, so the browser wrapped everything below the
           controls in it too. The layout is kept exactly as it was; the closing tag is now explicit.) -->
      <div class="trials-config">
        <div class="trials-label-row">
          <label for="trials-input">Simulations:</label>
          <input type="number" id="trials-input" min="1" max="5000000" step="1" value="1000000">
        </div>
        <input type="range" id="trials-slider" min="0" max="1000" step="1" value="900" aria-label="Number of simulations (logarithmic)">

        <!-- Logarithmic axis labels. Positions are hand-tuned to line up with the slider thumb. -->
        <div class="trials-ticks">
          <span style="left: 0%;">1</span>
          <span style="left: 16.5%;">10</span>
          <span style="left: 30.7%;">100</span>
          <span style="left: 45%;">1k</span>
          <span style="left: 59.7%;">10k</span>
          <span style="left: 73%;">100k</span>
          <span style="left: 88%;">1M</span>
          <span style="left: 100%;">5M</span>
        </div>

        <div class="calc-actions-row">
          <button id="btn-calc" class="primary full-width-btn">Calculate Damage</button>
        </div>

        <div class="progress-wrapper" id="progress-wrapper">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="progress-text" id="progress-text"></div>

        <div class="kpi-cards">
          <div class="card"><span>Average DPS: </span><strong id="kpi-ev">0</strong></div>
          <div class="card"><span>Min/Max: </span><strong id="kpi-range">0 / 0</strong></div>
        </div>
        <div class="chart-container">
          <canvas id="chart-canvas"></canvas>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
